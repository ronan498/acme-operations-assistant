[project]
name = "acme-api"
version = "0.1.0"
description = "Acme Operations agentic assistant — API service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "redis>=5.2",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    # mcp 2.0.0 was 16 days old at scaffold time — pinned to the mature major (see DECISIONS.md)
    "mcp>=1.29,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
