[project]
name = "acme-mcp-server"
version = "0.1.0"
description = "Acme Operations agentic assistant — MCP tool server"
requires-python = ">=3.12"
dependencies = [
    # mcp 2.0.0 was 16 days old at scaffold time — pinned to the mature major (see DECISIONS.md)
    "mcp>=1.29,<2",
    "asyncpg>=0.30",
]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py312"
